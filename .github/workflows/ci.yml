name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    services:
      redis:
        image: redis:8.4-alpine@sha256:61ea466e4022f3803b9f019e01f7738aac694f01989aee35a013724921d8e742
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.3
          cache: true
      - name: Test with race detector
        run: go test -race ./...
      - name: Validate async REST OpenAPI and live-handler contract
        run: go test -count=1 -run '^TestOpenAPI' ./internal/httpapi
      - name: Exercise headless-Service DNS round robin contract
        run: go test -race -count=10 -run '^TestClientUsesGRPCRoundRobinAcrossResolvedHeadlessServiceEndpoints$' ./internal/sandbox
      - name: Vet
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build binary
        run: CGO_ENABLED=0 go build -trimpath ./cmd ./cmd/judge-admin
      - name: Build container image
        run: docker build -t coderushoj/judging-server:ci .
      - name: Verify runtime and migration binaries in image
        run: bash scripts/ci/test-image-contract.sh coderushoj/judging-server:ci
      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coderushoj/judging-server:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: trivy-results.sarif
      - name: Fail on HIGH or CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: coderushoj/judging-server:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"

  mysql84-bundle-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: croj_bundle_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.3
          cache: true
      - name: Run immutable bundle integration on MySQL 8.4
        env:
          EXTERNAL_JUDGE_MYSQL_TEST_DSN: root:@tcp(127.0.0.1:3306)/croj_bundle_ci?parseTime=true&multiStatements=true
        run: go test -race -count=1 -run '^TestExternalBundleSQLRepositoryIntegration$' ./internal/integration
      - name: Run durable job repository and lease integration on MySQL 8.4
        env:
          JUDGE_TEST_MYSQL_DSN: root:@tcp(127.0.0.1:3306)/croj_bundle_ci?parseTime=true&loc=UTC&charset=utf8mb4
        run: go test -race -count=1 ./internal/external
      - name: Run asynchronous REST end-to-end integration on MySQL 8.4
        env:
          ASYNC_REST_E2E_MYSQL_DSN: root:@tcp(127.0.0.1:3306)/croj_async_rest_e2e?parseTime=true&loc=UTC&charset=utf8mb4&multiStatements=true
        run: |
          mysql --host=127.0.0.1 --user=root --execute='CREATE DATABASE croj_async_rest_e2e CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci'
          go test -race -count=1 -run '^TestExternalAsyncRESTEndToEnd' ./internal/integration
      - name: Run durable webhook contract on MySQL 8.4
        env:
          JUDGE_TEST_MYSQL_DSN: root:@tcp(127.0.0.1:3306)/croj_bundle_ci?parseTime=true&loc=UTC&charset=utf8mb4
        run: go test -race -count=1 -timeout=10m ./internal/external -run '^TestMySQLWebhook'
      - name: Run canonical bundle ceiling integration on MySQL 8.4
        env:
          EXTERNAL_JUDGE_MYSQL_TEST_DSN: root:@tcp(127.0.0.1:3306)/croj_bundle_ci?parseTime=true&multiStatements=true
        run: go test -race -count=1 -run '^TestExternalBundleSQLRepositoryIntegration/tenant_and_platform_execution_ceilings_reject_before_publication$' ./internal/integration
      - name: Verify bundle MySQL CI contract
        run: bash scripts/ci/test-bundle-mysql84-contract.sh
      - name: Verify webhook MySQL CI contract
        run: |
          bash scripts/ci/test-webhook-mysql84-contract.sh
          bash scripts/ci/test-webhook-mysql84-contract-self-test.sh

  publish-image:
    name: Publish attested release image
    if: ${{ github.ref_type == 'tag' }}
    needs: [test, mysql84-bundle-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out the complete tag history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Verify annotated SemVer release tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse "$GITHUB_REF_NAME^{tag}" >/dev/null
          test "$(git rev-parse "$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Set up QEMU for cross-architecture builds
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable multi-architecture image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/coderushoj/croj-judging-server:${{ github.ref_name }}
            ghcr.io/coderushoj/croj-judging-server:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Attest image provenance with GitHub OIDC
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/coderushoj/croj-judging-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record immutable image manifest
        env:
          IMAGE_REPOSITORY: ghcr.io/coderushoj/croj-judging-server
          IMAGE_TAG: ${{ github.ref_name }}
          IMAGE_REVISION: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test "${IMAGE_DIGEST#sha256:}" != "$IMAGE_DIGEST"
          jq -n \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            --arg revision "$IMAGE_REVISION" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson platforms '["linux/amd64","linux/arm64"]' \
            '{repository:$repository,tag:$tag,revision:$revision,digest:$digest,platforms:$platforms}' \
            > judging-server-image.json
      - name: Upload immutable image manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: judging-server-image-${{ github.sha }}
          path: judging-server-image.json
          if-no-files-found: error

database:
  host: coderushoj-infra-mysql.coderushoj.svc
  port: 3306
  user: coderushoj
  password: ""
  name: code_rush_oj

rocketmq:
  name-server: "coderushoj-infra-rocketmq-namesrv.coderushoj.svc:9876"
  topic: "submission-topic" # 需要明确指定 Topic
  # producer:
  #  group: submission-producer-group # 如果需要生产者，则取消注释
  consumer:
    group: submission-consumer-group
    max-reconsume-times: 16 # 超限后由 RocketMQ 投递到 %DLQ%<group>

judge-result:
  backend-url: "http://croj-backend:7999/api"
  service-token: ""
  callback-timeout: "10s"
  cache-capacity: 10000
  cache-ttl: "6h"

test-bundles:
  endpoint: "coderushoj-infra-minio.coderushoj.svc:9000"
  bucket: "judge-bundles"
  region: "us-east-1"
  use-tls: false
  access-key: ""
  secret-key: ""
  cache-dir: "/tmp/croj-bundles"
  cache-max-bytes: 2147483648
  max-object-bytes: 536870912
  cache-ttl: "24h"
  max-files: 20001
  max-manifest-bytes: 1048576
  max-case-bytes: 67108864
  max-uncompressed-bytes: 536870912
  max-compression-ratio: 200
  max-infra-attempts: 3
  max-time-limit-millis: 10000
  max-memory-limit-mib: 1024

sandbox-discovery:
  target: "dns:///sandbox-workers.coderushoj.svc.cluster.local:50051"
  allow-legacy-endpoint-slice: false
  namespace: "coderushoj"
  service: "croj-sandbox"
  port-name: "grpc"
  refresh-interval: "5s"
  execute-timeout: "60s"
  max-connections: 128
  connection-idle-ttl: "5m"
  kubeconfig: ""

# Disabled by default. Enabling this listener also enables durable REST workers
# and requires MySQL schema v4, Redis, MinIO, source encryption keys, and DNS.
external-api:
  enabled: false
  listen-address: "127.0.0.1:8081"
  worker-id: "judge-external"
  worker-concurrency: 2
  lease-duration: "30s"
  heartbeat-interval: "10s"
  control-poll-interval: "1s"
  idle-backoff: "250ms"
  retry-delay: "5s"
  shutdown-timeout: "20s"
  readiness-timeout: "2s"
  redis-address: "coderushoj-infra-redis.coderushoj.svc:6379"
  redis-password: ""
  redis-db: 0
  redis-quota-prefix: "coderushoj"
  auth-pepper-base64: ""
  idempotency-pepper-base64: ""
  cursor-key-base64: ""
  source-key-base64: ""
  source-key-version: 1
  idempotency-ttl: "24h"
  quota-refill-period: "1m"
  job-submit-capacity: 1000
  bundle-byte-capacity: 536870912

apiVersion: batch/v1
kind: Job
metadata:
  name: coderushoj-judge-schema-v6
  namespace: coderushoj
  labels:
    app.kubernetes.io/name: croj-judging-server
    app.kubernetes.io/component: schema-migration
    coderushoj.dev/judge-schema-version: "6"
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: croj-judging-server
        app.kubernetes.io/component: schema-migration
        coderushoj.dev/judge-schema-version: "6"
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Replace with the exact immutable image digest used by the following rollout.
          image: ghcr.io/coderushoj/croj-judging-server@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["/app/judge-admin"]
          args: ["schema", "migrate"]
          env:
            - name: JUDGE_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: coderushoj-judge-database
                  key: dsn
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

  schemas:
    ExternalId:
      type: string
      pattern: '^[a-z2-7]{26}$'
      example: ceirceirceirceirceirceirce
    LanguageCapability:
      type: object
      additionalProperties: false
      required: [id, displayName, runtime]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9._-]{1,31}$'
        displayName:
          type: string
          minLength: 1
        runtime:
          type: string
          minLength: 1
    CapabilityLimits:
      type: object
      additionalProperties: false
      required: [maxSourceBytes, maxBundleBytes, maxCaseBytes, maxCaseCount, maxTimeLimitMillis, maxMemoryLimitMiB]
      properties:
        maxSourceBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1537228672809118378
        maxBundleBytes:
          type: integer
          format: int64
          minimum: 1
        maxCaseBytes:
          type: integer
          format: int64
          minimum: 1
        maxCaseCount:
          type: integer
          minimum: 1
          maximum: 256
        maxTimeLimitMillis:
          type: integer
          minimum: 1
          description: Maximum per-case wall-clock limit accepted in an immutable bundle manifest.
        maxMemoryLimitMiB:
          type: integer
          minimum: 1
          description: Maximum per-case memory limit accepted in an immutable bundle manifest.
    Capabilities:
      type: object
      additionalProperties: false
      required: [apiVersion, languages, judgeModes, checkers, limits]
      properties:
        apiVersion:
          type: string
          const: v1
        languages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LanguageCapability'
        judgeModes:
          type: array
          items:
            type: string
        checkers:
          type: array
          items:
            type: string
        limits:
          $ref: '#/components/schemas/CapabilityLimits'
    BundleUpload:
      type: object
      additionalProperties: false
      required: [bundle]
      properties:
        bundle:
          type: string
          format: binary
          contentMediaType: application/zip
    BundleMetadata:
      type: object
      additionalProperties: false
      required: [bundleId, sha256, sizeBytes, caseCount, manifestVersion, createdAt]
      properties:
        bundleId:
          $ref: '#/components/schemas/ExternalId'
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        caseCount:
          type: integer
          minimum: 1
          maximum: 256
        manifestVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
    SubmitJobRequest:
      type: object
      additionalProperties: false
      required: [bundleId, language, sourceCode]
      properties:
        bundleId:
          $ref: '#/components/schemas/ExternalId'
        language:
          type: string
          pattern: '^[a-z][a-z0-9._-]{1,31}$'
        sourceCode:
          type: string
          minLength: 1
          description: UTF-8 contestant source. This field exists only in the submit request.
        stopOnFailure:
          type: boolean
          default: false
        callbackId:
          $ref: '#/components/schemas/ExternalId'
        clientReference:
          type: string
          maxLength: 255
    JobStatus:
      type: string
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED]
    CaseResultView:
      type: object
      additionalProperties: false
      required: [caseId, verdict, timeMillis, memoryBytes]
      properties:
        caseId:
          type: string
        verdict:
          type: string
        timeMillis:
          type: integer
          format: int64
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
    JobResultView:
      type: object
      additionalProperties: false
      required: [verdict, compileStatus, timeMillis, memoryBytes, cases]
      properties:
        verdict:
          type: string
        compileStatus:
          type: string
        timeMillis:
          type: integer
          format: int64
          minimum: 0
        memoryBytes:
          type: integer
          format: int64
          minimum: 0
        cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseResultView'
    JobView:
      type: object
      additionalProperties: false
      required: [jobId, status, createdAt]
      properties:
        jobId:
          $ref: '#/components/schemas/ExternalId'
        status:
          $ref: '#/components/schemas/JobStatus'
        statusUrl:
          type: string
          pattern: '^/api/v1/judge-jobs/[a-z2-7]{26}$'
        createdAt:
          type: string
          format: date-time
        clientReference:
          type: string
          maxLength: 255
        result:
          $ref: '#/components/schemas/JobResultView'
    JobListPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobView'
        nextCursor:
          type: string
          maxLength: 512
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        requestId:
          type: string
